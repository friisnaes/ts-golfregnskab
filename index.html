<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GUCCI Golf — Sæson 2027</title>
<meta name="description" content="GUCCI Golf: stilling, runder og ekspeditioner i sæson 2027 — og årbogen for sæson 2026.">
<meta name="theme-color" content="#FBFAF5">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GUCCI Golf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300..700&family=Marcellus&display=swap" rel="stylesheet">
<style>
/* ───────────────────────────────────────────────────────────────
   GUCCI Golf 2027 — "Rivieraen"
   Kalkhvid stuk, marineblåt blæk, azur og mimosagul.
   Marcellus til navne og tal · Jost til tekst og etiketter.
   Fuld skærmbredde: båndene går fra kant til kant, kun teksten har linjelængde.
   ─────────────────────────────────────────────────────────────── */
:root{
  --paper:#FBFAF5; --leaf:#E4EEF3; --ink:#0E2A47; --soft:#4A6079;
  --rule:rgba(14,42,71,.24); --hair:rgba(14,42,71,.11);
  --brass:#1A5FA8;   /* azur: accent til tekst og tal */
  --pop:#D99A0B;     /* mimosagul: stempel, ringe og streger */
  --board:#0E2A47; --gilt:#F6EDD6; --dw:400;
  --gut:clamp(20px,4.6vw,92px);
  --serif:'Marcellus','Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{font-synthesis:none;font-size:19.5px;-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
@media (max-width:600px){html{font-size:18px}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--sans);font-size:1rem;line-height:1.6;color:var(--ink);background:var(--paper);
  font-variant-numeric:lining-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.lab{font-family:var(--sans);font-stretch:76%;font-weight:500;font-size:.84rem;letter-spacing:.015em;color:var(--soft);line-height:1.35}
.num small{font-size:.52em;letter-spacing:0}

/* Topbjælke */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px 32px;flex-wrap:wrap;padding:16px var(--gut);border-bottom:1px solid var(--rule)}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;font-size:1.3rem;line-height:1;text-decoration:none}
.mark svg{width:22px;height:28px;flex:none}
.bar nav{display:flex;gap:clamp(16px,2.4vw,36px);overflow-x:auto;scrollbar-width:none;max-width:100%}
.bar nav::-webkit-scrollbar{display:none}
.bar nav a{font-stretch:78%;font-weight:500;font-size:.9rem;text-decoration:none;white-space:nowrap;padding:6px 0;border-bottom:1px solid transparent}
.bar nav a:hover{border-bottom-color:var(--brass)}

/* Åbningsopslaget */
.spread{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);border-bottom:1px solid var(--rule)}
.pg{padding:clamp(40px,5.6vw,100px) var(--gut) clamp(44px,6vw,108px)}
.pg-l{position:relative}
.pg-r{background:var(--leaf);border-left:1px solid var(--rule)}
.champ{font-family:var(--serif);font-weight:var(--dw);font-size:clamp(3.2rem,7.3vw,9.2rem);line-height:.92;letter-spacing:-.025em;margin:.32em 0 .42em;font-optical-sizing:auto}
.champ span{display:block;white-space:nowrap}
.lede{font-family:var(--serif);font-size:clamp(1.3rem,2vw,1.75rem);line-height:1.28;max-width:24ch}
.jersey{margin-top:clamp(28px,3.4vw,52px);max-width:34rem}
.jersey ol{list-style:none;padding:0;margin-top:8px;border-top:1px solid var(--rule)}
.jersey li{display:grid;grid-template-columns:4.6rem minmax(0,1fr) auto;gap:16px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:.95rem}
.jersey li span:first-child,.jersey li span:last-child{color:var(--soft);font-variant-numeric:tabular-nums}
.seal{position:absolute;top:clamp(22px,3.4vw,56px);right:clamp(-34px,-2.2vw,-14px);width:clamp(104px,11.5vw,172px);height:auto;color:var(--pop);transform:rotate(-9deg);opacity:.9;z-index:2;pointer-events:none;animation:stamp .55s cubic-bezier(.2,.9,.3,1.25) .45s both}
@keyframes stamp{from{opacity:0;transform:rotate(-16deg) scale(1.55)}to{opacity:.9;transform:rotate(-9deg) scale(1)}}
.pg-r h2,.pg-r .h2{font-family:var(--serif);font-weight:var(--dw);font-size:clamp(1.5rem,2.2vw,2rem);line-height:1.1;margin-bottom:clamp(14px,1.8vw,26px)}
.tbl{list-style:none;padding:0}
.tbl li{display:grid;grid-template-columns:1.3em auto minmax(0,1fr) auto;align-items:center;gap:0 clamp(12px,1.5vw,22px);padding:clamp(13px,1.5vw,21px) 0;border-top:1px solid var(--rule)}
.tbl li:last-child{border-bottom:1px solid var(--rule)}
.rk{font-family:var(--serif);font-size:1.15rem;color:var(--soft)}
.face{width:54px;height:54px;border-radius:50%;object-fit:cover;filter:grayscale(1) contrast(1.06);border:1px solid var(--rule);background:var(--paper);display:block}
.nm b{display:block;font-family:var(--serif);font-weight:var(--dw);font-size:clamp(1.45rem,2.2vw,2.1rem);line-height:1.12}
.tot{font-family:var(--serif);font-weight:var(--dw);font-size:clamp(2.5rem,4.3vw,4.2rem);line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.tbl li.first .tot{color:var(--brass)}
.pg-r .foot{margin-top:18px;max-width:40ch}

/* Bånd */
.band{padding:clamp(56px,7.2vw,124px) var(--gut);border-bottom:1px solid var(--rule)}
.band>header{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px clamp(24px,5vw,96px);align-items:end;margin-bottom:clamp(28px,3.8vw,60px)}
.band h2{font-family:var(--serif);font-weight:var(--dw);font-size:clamp(2rem,4vw,3.6rem);line-height:1.02;letter-spacing:-.015em;text-wrap:balance}
p{text-wrap:pretty}
.lede,.tease{text-wrap:balance}
.band>header p{color:var(--soft);max-width:48ch}
.band h3{font-family:var(--serif);font-weight:var(--dw);font-size:clamp(1.45rem,2.1vw,1.9rem);line-height:1.15}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,5vw,96px)}

/* Titelkampen */
.race{width:100%}
.race svg{display:block;width:100%;height:auto;overflow:visible}
.race text{font-family:var(--sans);font-stretch:76%;font-weight:500;fill:var(--soft);font-size:15px}
.race .end{font-family:var(--serif);font-stretch:normal;font-weight:var(--dw);fill:var(--ink)}
.race .end:not([font-size]){font-size:20px}

/* Rekorder */
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,21rem),1fr));column-gap:clamp(24px,5vw,96px)}
.rec{display:grid;grid-template-columns:6.4rem minmax(0,1fr);gap:0 18px;align-items:start;padding:22px 0;border-top:1px solid var(--rule)}
.rec .v{font-family:var(--serif);font-weight:var(--dw);font-size:3rem;line-height:.95;font-variant-numeric:tabular-nums}
.rec .w{font-family:var(--serif);font-size:1.4rem;line-height:1.15;margin:3px 0 4px}
.rec .d{color:var(--soft);font-size:.92rem;line-height:1.45}
.tease{margin-top:clamp(28px,3.4vw,48px);font-family:var(--serif);font-style:italic;font-size:clamp(1.3rem,2vw,1.7rem);line-height:1.3;max-width:30ch}

/* Referat */
.story{columns:2 24rem;column-gap:clamp(32px,5vw,96px)}
.story strong{font-weight:600}

/* Riviera */
.riv h3{margin-bottom:2px}
.rt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:16px}
.rt th{font-stretch:76%;font-weight:500;font-size:.84rem;color:var(--soft);text-align:right;padding:8px 5px;border-bottom:1px solid var(--ink)}
.rt th:nth-child(2){text-align:left}
.rt td{padding:10px 5px;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap}
.rt td.r{text-align:left;color:var(--soft);width:1.6em;padding-left:0}
.rt td.n{text-align:left;font-family:var(--serif);font-size:1.25rem}
.rt td.t{font-family:var(--serif);font-size:1.5rem;font-weight:600;padding-right:0}
.rt tr.w td.t{color:var(--brass)}
.ring{display:inline-grid;place-items:center;min-width:1.95em;height:1.95em;border:1.5px solid var(--pop);border-radius:50%;margin:-.3em -.35em -.3em 0}
.riv .lab{margin-top:14px;max-width:72ch}
.riv .lab a{color:var(--ink)}

/* Mestertavlen */
.board{background:var(--board);color:var(--gilt);border-bottom:0;padding-block:clamp(28px,3.4vw,56px)}
.board .frame{border:1px solid color-mix(in srgb,var(--gilt) 55%,transparent);outline:1px solid color-mix(in srgb,var(--gilt) 22%,transparent);outline-offset:6px;padding:clamp(28px,4.4vw,80px) clamp(22px,4.4vw,80px)}
.board header{display:flex;justify-content:space-between;align-items:baseline;gap:16px 40px;flex-wrap:wrap;margin-bottom:clamp(22px,3vw,44px)}
.board h2{font-family:var(--serif);font-weight:var(--dw);font-size:clamp(2rem,4vw,3.6rem);line-height:1.02;letter-spacing:-.015em}
.board .lab{color:var(--gilt);opacity:.8}
.honours{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:clamp(24px,5vw,96px)}
.honours li{display:flex;align-items:baseline;gap:18px;padding:17px 0;border-top:1px solid color-mix(in srgb,var(--gilt) 30%,transparent);font-family:var(--serif)}
.honours .y{font-size:1.05rem;font-variant-numeric:tabular-nums;opacity:.72;min-width:2.7em}
.honours .n{font-size:clamp(1.4rem,2.3vw,2.15rem);line-height:1.12;letter-spacing:.005em}

/* Sæson 2027 */
.when{font-family:var(--serif);font-size:clamp(1.9rem,3.3vw,3rem);line-height:1.05;margin:10px 0 4px}
.plain{list-style:none;padding:0;margin-top:18px;border-top:1px solid var(--rule)}
.plain li{padding:11px 0;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.plain li span:nth-child(2){color:var(--soft);text-align:right}
.field{list-style:none;padding:0;margin-top:14px;border-top:1px solid var(--rule)}
.field li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair)}
.field .face{width:42px;height:42px}
.field b{font-weight:500}
.field .h{font-family:var(--serif);font-size:1.35rem;font-variant-numeric:tabular-nums}
.note{margin-top:16px;color:var(--soft);max-width:50ch}

/* Rundelisten */
.month{font-family:var(--serif);font-size:1.35rem;padding:30px 0 10px}
.month:first-child{padding-top:0}
.rnd{border-top:1px solid var(--rule)}
.rnd:last-child{border-bottom:1px solid var(--rule)}
.rnd>summary{display:grid;grid-template-columns:5.2rem minmax(0,1.15fr) minmax(0,1.5fr) 1.1rem;gap:0 clamp(14px,2vw,28px);align-items:baseline;padding:15px 0;cursor:pointer;list-style:none}
.rnd>summary::-webkit-details-marker{display:none}
.rnd>summary:hover .r-course b{text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:4px}
.r-date{font-family:var(--serif);font-size:1.2rem;white-space:nowrap}
.r-course{min-width:0}
.r-course b{font-weight:500}
.r-course small{display:block;color:var(--soft);font-size:.86rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rnd[open] .r-course small{white-space:normal}
.r-mini{display:flex;flex-wrap:wrap;gap:2px 20px;justify-content:flex-end;font-variant-numeric:tabular-nums;font-size:.95rem;color:var(--soft)}
.r-mini .win{color:var(--ink);font-weight:600}
.r-chev{font-size:1.25rem;font-weight:400;line-height:1;text-align:right;color:var(--brass)}
.r-chev::after{content:'+'}
.rnd[open] .r-chev::after{content:'\2013'}
.r-body{padding:4px 0 34px}
.r-meta{margin-bottom:14px}
.res{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:min(100%,26rem)}
.res th{font-stretch:76%;font-weight:500;font-size:.84rem;color:var(--soft);text-align:right;padding:6px 14px 6px 0;border-bottom:1px solid var(--ink)}
.res th:nth-child(-n+2){text-align:left}
.res td{padding:8px 14px 8px 0;border-bottom:1px solid var(--hair);text-align:right}
.res td:nth-child(-n+2){text-align:left}
.res td:nth-child(2){font-family:var(--serif);font-size:1.15rem;padding-right:28px}
.scw{overflow-x:auto;margin-top:22px;-webkit-overflow-scrolling:touch}
.sc{border-collapse:collapse;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums;text-align:center}
.sc th,.sc td{padding:6px 2px;border-bottom:1px solid var(--hair)}
.sc thead th{font-stretch:76%;font-weight:500;color:var(--soft)}
.sc thead tr:last-child th{border-bottom:1px solid var(--ink)}
.sc .who{text-align:left;white-space:nowrap;padding-right:16px;position:sticky;left:0;background:var(--paper);z-index:1}
.sc tbody .who b{font-family:var(--serif);font-weight:var(--dw);font-size:1.3em;display:block;line-height:1.15}
.sc .who small{color:var(--soft);font-stretch:76%;font-size:.95em}
.sc .sm{font-weight:600;border-left:1px solid var(--hair);min-width:2.6em}
.sc .sm.st{font-family:var(--serif);font-size:1.35em;color:var(--brass)}
.g{display:inline-grid;place-items:center;width:1.85em;height:1.85em;line-height:1}
.g.bi,.g.ea{border:1.5px solid var(--pop);border-radius:50%}
.g.ea{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--pop)}
.g.db{border:1px solid rgba(86,100,91,.65)}
.g.z{color:#96A098}
.pt{display:block;font-size:.76em;color:var(--soft);line-height:1.1;margin-top:1px}
.legend{margin-top:12px}

/* Reglement */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:0 clamp(24px,5vw,96px)}
.rules div{padding:20px 0;border-top:1px solid var(--rule)}
.rules dt{font-family:var(--serif);font-size:1.4rem;line-height:1.15;margin-bottom:6px}
.rules dd{color:var(--soft);font-size:.95rem;max-width:44ch}

/* Arkiv */
.links{list-style:none;padding:0;border-top:1px solid var(--rule)}
.links li{border-bottom:1px solid var(--rule)}
.links a{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:4px clamp(24px,5vw,96px);align-items:baseline;padding:18px 0;text-decoration:none}
.links a b{font-family:var(--serif);font-weight:var(--dw);font-size:1.4rem;line-height:1.15}
.links a span{color:var(--soft)}
.links a:hover b{text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:5px}
.vault{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.vault>summary{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:4px clamp(24px,5vw,96px);align-items:baseline;padding:18px 0;cursor:pointer;list-style:none}
.vault>summary::-webkit-details-marker{display:none}
.vault>summary b{font-family:var(--serif);font-weight:var(--dw);font-size:1.4rem;line-height:1.15}
.vault>summary span{color:var(--soft)}
.vault>summary b::after{content:' +';color:var(--brass)}
.vault[open]>summary b::after{content:' \2013'}
.vault>summary:hover b{text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:5px}
.vault .inner{padding:18px 0 40px}
footer{padding:36px var(--gut) 44px;display:flex;justify-content:space-between;gap:12px 32px;flex-wrap:wrap}

/* iPad og mobil */
@media (max-width:980px){
  .spread{grid-template-columns:1fr}
  .pg-r{border-left:0;border-top:1px solid var(--rule)}
  .champ{font-size:clamp(3.3rem,17.5vw,7.4rem)}
  .seal{right:var(--gut);width:clamp(96px,22vw,150px)}
  .honours{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .band>header,.two,.links a,.vault>summary{grid-template-columns:1fr}
  .two{gap:56px}
  .rnd>summary{grid-template-columns:4.6rem minmax(0,1fr) 1.1rem}
  .r-mini{grid-column:2/3;justify-content:flex-start;gap:0 16px;margin-top:4px}
  .r-chev{grid-column:3;grid-row:1}
  .rec{grid-template-columns:5.2rem minmax(0,1fr)}
  .rec .v{font-size:2.5rem}
  .face{width:46px;height:46px}
  .honours{grid-template-columns:1fr}
  .rt td.r,.rt th:first-child{display:none}
  .rt td.n{font-size:1.1rem}
  .story{columns:1}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.seal{animation:none}}
@media print{.bar nav,.r-chev{display:none}.seal{animation:none}}

/* Forsiden som plakat: navnet centreret, førertrøjen som tidslinje, stillingen i fire søjler */
.spread{grid-template-columns:1fr}
.pg-l{text-align:center;padding-bottom:clamp(36px,4.4vw,72px)}
.seal{position:static;display:block;margin:0 auto clamp(14px,2vw,26px);width:clamp(92px,9vw,132px)}
.champ{font-size:clamp(3rem,8.4vw,10.5rem);letter-spacing:0;line-height:1.02;margin:.16em 0 .3em}
.champ span{display:inline-block;margin:0 .13em}
.lede{margin-inline:auto;max-width:32ch}
.jersey{max-width:62rem;margin-inline:auto}
.jersey .lab{text-align:center}
.jersey ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:0 6px;border-top:0;margin-top:14px}
.jersey li{display:block;text-align:center;border-bottom:0;border-top:3px solid var(--pop);padding:12px 6px 10px}
.jersey li span{display:block}
.pg-r{border-left:0;border-top:1px solid var(--rule);text-align:center}
.tbl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tbl li{display:flex;flex-direction:column;align-items:center;gap:8px;border-top:0;border-left:1px solid var(--rule);padding:4px 10px}
.tbl li:first-child{border-left:0}
.tbl li:last-child{border-bottom:0}
.tbl .face{width:clamp(64px,7vw,104px);height:clamp(64px,7vw,104px);border:3px solid var(--paper);outline:1px solid var(--rule)}
.tot{text-align:center;font-size:clamp(2.8rem,6vw,5.6rem);margin-top:6px}
.pg-r .foot{margin-inline:auto}
.tease{font-style:normal}
.lab{letter-spacing:.03em}
.honours li{border-top-color:color-mix(in srgb,var(--pop) 70%,transparent)}
@media (max-width:980px){.champ{font-size:clamp(3rem,14.5vw,7rem)}}
@media (max-width:760px){.tbl{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:30px}.tbl li:nth-child(odd){border-left:0}}


/* Forsidens rækkefølge på alle skærme: navn → stilling → førertrøjen.
   Så står mester og slutstilling på første skærmbillede på en laptop. */
.spread{display:flex;flex-direction:column;text-align:center}
.pg-l{display:contents}
.pg-l>.seal{margin:clamp(22px,2.6vw,40px) auto clamp(10px,1.4vw,20px)}
.pg-l>.lab{padding-inline:var(--gut)}
.pg-l>.lab:first-child{margin-top:clamp(36px,4.4vw,72px)}
.champ{padding-inline:var(--gut)}
.lede{align-self:center;max-width:min(32ch,calc(100% - 2 * var(--gut)));margin-bottom:clamp(28px,3.2vw,52px)}
.pg-r{order:1;padding-top:clamp(24px,2.6vw,44px);padding-bottom:clamp(30px,3.4vw,56px)}
.pg-r .h2{margin-bottom:12px}
.jersey{order:2;width:min(62rem,calc(100% - 2 * var(--gut)));max-width:none;margin:clamp(30px,3.6vw,56px) auto clamp(40px,5vw,84px)}
@media (min-width:981px) and (max-height:900px){
  .pg-l>.seal{width:80px;margin-top:16px;margin-bottom:8px}
  .champ{font-size:clamp(3rem,7.2vw,8rem);margin:.1em 0 .22em}
  .lede{margin-bottom:22px}
  .pg-r{padding-top:16px}

/* ════════════════════════════════════════════════════════════════
   3. MOTOREN — beregner stilling, rekorder og visning ud fra data

const MON = ['januar','februar','marts','april','maj','juni','juli','august','september','oktober','november','december'];
const MON_S = ['jan.','feb.','mar.','apr.','maj','jun.','jul.','aug.','sep.','okt.','nov.','dec.'];
const TAL = ['nul','én','to','tre','fire','fem','seks','syv','otte','ni','ti'];
const dp = s => { const a = s.split('-').map(Number); return {y:a[0], m:a[1], d:a[2]}; };
const dLong = s => { const p = dp(s); return p.d + '. ' + MON[p.m-1]; };
const dShort = s => { const p = dp(s); return p.d + '. ' + MON_S[p.m-1]; };
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const clean = c => String(c || '').replace(/[\u{1F1E6}-\u{1F1FF}\u{1F3C6}\uFE0F]/gu,'').trim();
const sum = a => a.reduce((s,v) => s + v, 0);
const uniq = a => a.filter((v,i) => a.indexOf(v) === i);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const listDa = a => a.length < 2 ? (a[0] || '') : a.slice(0,-1).join(', ') + ' og ' + a[a.length-1];
// Danske tal: 35.5 → "35,5", 37 → "37"
const fmt = (v, dec) => { if (v == null) return '–'; const s = dec != null ? v.toFixed(dec) : (Number.isInteger(v) ? String(v) : String(Math.round(v*10)/10)); return s.replace('.', ','); };
const numHTML = (v, dec) => { const a = fmt(v, dec).split(','); return a[1] ? a[0] + '<small>,' + a[1] + '</small>' : a[0]; };
const face = (n, cls) => PHOTOS[n] ? '<img class="' + (cls || 'face') + '" src="' + PHOTOS[n] + '" alt="">' : '<span class="' + (cls || 'face') + '"></span>';

function prep(rounds){
  return rounds.filter(r => (r.results || []).length && !r.private)
    .map(r => Object.assign({}, r, {holeData:(r.holeData || []).map(h => Array.isArray(h) ? {par:h[0], hcp:h[1]} : h)}))
    .sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
}
// Stemmer slag og stableford-point overens på hullet? Tildelte slag fordeles efter hcp-indeks.
// Huller, hvor de ikke gør, tæller ikke i birdie- og eagle-statistikken.
const holeOk = (g, pts, h, phcp) => pts == null || phcp == null || Math.max(0, 2 + h.par + Math.floor(phcp / 18) + ((phcp % 18) >= h.hcp ? 1 : 0) - g) === pts;
const best15 = a => a.slice().sort((x,y) => y - x).slice(0,15);

// ── Datakontrol ────────────────────────────────────────────────
// Køres hver gang siden åbnes: slag mod stableford-point på hvert hul, kortets summer mod
// resultatet, og ligapoint mod placeringerne (3-2-1-0 / 2-1-0 / 1-0, delt ved lighed).
function audit(rounds){
  const out = []; let holes = 0, holesOk = 0, cards = 0;
  rounds.forEach(r => {
    const H = r.holeData || [], n = r.results.length, add = (who, msg) => out.push({date:r.date, course:clean(r.course), who:who, msg:msg, ok:r.confirmed || ''});
    const base = n === 4 ? [3,2,1,0] : n === 3 ? [2,1,0] : n === 2 ? [1,0] : null;
    if (base && r.counting !== false) { const byScore = r.results.every(y => y.score != null), key = x => byScore ? -x.score : x.placement;
      const srt = r.results.slice().sort((a,b) => key(a) - key(b));
      srt.forEach(x => { const grp = srt.map((y,j) => key(y) === key(x) ? j : -1).filter(j => j >= 0), exp = sum(grp.map(j => base[j])) / grp.length;
        if (Math.abs(exp - x.points) > 1e-9) add(x.player, 'ligapoint ført som ' + fmt(x.points) + ', skulle være ' + fmt(exp)); }); }
    (r.scorecards || []).forEach(sc => { cards++; const g = sc.scores || [], p = sc.points || []; let off = 0;
      g.forEach((v,i) => { if (!H[i] || !v) return; holes++; if (holeOk(v, p[i], H[i], sc.phcp)) holesOk++; else off++; });
      if (off) add(sc.player, 'slag og point stemmer ikke på ' + off + (off === 1 ? ' hul' : ' huller'));
      const res = r.results.find(x => x.player === sc.player);
      if (res && res.score != null && p.length && sum(p) !== res.score) add(sc.player, 'pointene på kortet giver ' + sum(p) + ', men resultatet er ført som ' + res.score);
      if (sc.slag != null && g.length && sum(g) !== sc.slag) add(sc.player, 'slagene på kortet giver ' + sum(g) + ', men totalen er ført som ' + sc.slag);
    });
  });
  return {issues:out.filter(i => !i.ok), settled:out.filter(i => i.ok), holes:holes, holesOk:holesOk, cards:cards};
}
const nf = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const nAfv = n => (TAL[n] || n) + (n === 1 ? ' afvigelse' : ' afvigelser');
const auditList = list => '<ul class="plain">' + list.map(i => '<li><span>' + dLong(i.date) + ', ' + esc(i.course) + '</span><span>' + i.who + ': ' + i.msg + '</span></li>').join('') + '</ul>';
// Afklarede afvigelser: runden har confirmed:'…' i data, fordi Thomas har bekræftet resultatet.

    : a.holes > a.holesOk ? '. De sidste ' + (a.holes - a.holesOk) + ' er gennemgået og tæller ikke med i birdie-statistikken.' : '.'); }

  const status = a.issues.length ? cap(nAfv(a.issues.length)) + ' venter på afklaring.' : a.settled.length ? 'Ingen åbne afvigelser. ' + cap(nAfv(a.settled.length)) + ' er gennemgået og afklaret.' : 'Ingen afvigelser.';
  return '<details class="vault" style="border-top:0"' + (a.issues.length ? ' open' : '') + '><summary><b>Datakontrol ' + year + '</b><span>' + nf(a.holesOk) + ' af ' + nf(a.holes) + ' huller på ' + a.cards + ' scorekort stemmer. ' + status + '</span></summary><div class="inner">' +
    '<p class="note" style="margin:0 0 16px">Kontrollen køres, hver gang siden åbnes: slag mod stableford-point på hvert hul, kortets summer mod resultatet, og ligapoint mod placeringerne. Birdies og eagles tælles kun på huller, der består.</p>' +

// Stilling: kun de 15 bedste runder tæller. Delt sejr tæller som en brøkdel.
function standings(rs){
  const t = {}; PLAYERS.forEach(p => t[p] = {name:p, pts:[], wins:0});
  rs.forEach(r => { const w = r.results.filter(x => x.placement === 1).length || 1;
    r.results.forEach(x => { const o = t[x.player]; if (!o) return; o.pts.push(x.points); if (x.placement === 1) o.wins += 1/w; }); });
  return Object.values(t).map(o => Object.assign(o, {rounds:o.pts.length, total:sum(best15(o.pts))}))
    .sort((a,b) => b.total - a.total || b.wins - a.wins);
}

// Førertrøjens rejse + stillingen efter hver runde (til grafen).
function journey(rs){
  const pts = {}; PLAYERS.forEach(p => pts[p] = []);
  const changes = [], series = []; let prev = '';
  rs.forEach((r,i) => {
    r.results.forEach(x => { if (pts[x.player]) pts[x.player].push(x.points); });
    const tot = {}; PLAYERS.forEach(p => tot[p] = sum(best15(pts[p])));
    const mx = Math.max.apply(null, PLAYERS.map(p => tot[p]));
    const lead = mx > 0 ? PLAYERS.filter(p => tot[p] === mx) : [];
    const key = lead.join('+');
    if (key && key !== prev) { changes.push({date:r.date, course:clean(r.course), lead:lead, i:i}); prev = key; }
    series.push({date:r.date, tot:tot});
  });
  return {changes:changes, series:series};
}

function holder(top){
  const names = uniq(top.map(o => o.p));
  if (top.length === 1) return {who:names[0], detail:clean(top[0].r.course) + ', ' + dLong(top[0].r.date)};
  if (names.length === 1) return {who:names[0], detail:cap(TAL[top.length] || String(top.length)) + ' gange: ' + listDa(top.map(o => dLong(o.r.date)))};
  return {who:listDa(names), detail:listDa(top.map(o => o.p + ' ' + dLong(o.r.date)))};
}

// Rekorder beregnes altid direkte fra runderne — intet er skrevet ind i hånden.
function records(rs){
  const out = [], st = standings(rs);
  const byAvg = (map, min) => Object.keys(map).filter(p => map[p].length >= min).map(p => ({p:p, n:map[p].length, v:sum(map[p]) / map[p].length})).sort((a,b) => b.v - a.v);

  const hs = []; rs.forEach(r => { if (r.holes !== 18) return; r.results.forEach(x => { if (x.score != null && !x.nr && PLAYERS.includes(x.player)) hs.push({p:x.player, v:x.score, r:r}); }); });
  if (hs.length) { const m = Math.max.apply(null, hs.map(o => o.v)); out.push(Object.assign({label:'Højeste stableford-score', value:numHTML(m)}, holder(hs.filter(o => o.v === m)))); }

  const ls = []; rs.forEach(r => (r.scorecards || []).forEach(sc => { if (r.holes === 18 && sc.scores && sc.scores.length === 18 && !sc.nr && PLAYERS.includes(sc.player)) ls.push({p:sc.player, v:sc.slag != null ? sc.slag : sum(sc.scores), r:r}); }));
  if (ls.length) { const m = Math.min.apply(null, ls.map(o => o.v)); out.push(Object.assign({label:'Færreste slag på 18 huller', value:numHTML(m)}, holder(ls.filter(o => o.v === m)))); }

  const w = st.slice().sort((a,b) => b.wins - a.wins);
  if (w[0] && w[0].wins > 0) out.push({label:'Flest rundesejre', value:numHTML(w[0].wins), who:w[0].name,
    detail:(w[1] && w[1].wins > 0 ? w[1].name + ' vandt ' + fmt(w[1].wins) + '. ' : '') + 'En delt sejr tæller en halv.'});

  const sm = {}; hs.forEach(o => (sm[o.p] = sm[o.p] || []).push(o.v));
  const sa = byAvg(sm, 8);
  if (sa.length) out.push({label:'Bedste stableford-snit', value:numHTML(sa[0].v, 1), who:sa[0].p,
    detail:'Over ' + sa[0].n + ' fulde runder.' + (sa[1] ? ' ' + sa[1].p + ' næstbedst med ' + fmt(sa[1].v, 1) + '.' : '')});

  const lm = {}; st.forEach(o => lm[o.name] = o.pts);
  const la = byAvg(lm, 8);
  if (la.length) out.push({label:'Flest ligapoint pr. runde', value:numHTML(la[0].v, 2), who:la[0].p,
    detail:'Snit over alle ' + la[0].n + ' tællende runder.' + (la[1] ? ' ' + la[1].p + ': ' + fmt(la[1].v, 2) + '.' : '')});

  const bi = {}, ea = {}; rs.forEach(r => (r.scorecards || []).forEach(sc => { if (!PLAYERS.includes(sc.player)) return;
    (sc.scores || []).forEach((g,i) => { const h = r.holeData[i]; if (!h || !g || !holeOk(g, (sc.points || [])[i], h, sc.phcp)) return; if (g === h.par - 1) bi[sc.player] = (bi[sc.player] || 0) + 1; if (g <= h.par - 2) ea[sc.player] = (ea[sc.player] || 0) + 1; }); }));
  const bs = Object.keys(bi).map(p => ({p:p, v:bi[p]})).sort((a,b) => b.v - a.v);
  if (bs.length) out.push({label:'Flest birdies', value:numHTML(bs[0].v), who:bs[0].p,
    detail:(bs[1] ? bs[1].p + ' lavede ' + bs[1].v + '. ' : '') + (ea[bs[0].p] ? 'Dertil ' + (TAL[ea[bs[0].p]] || ea[bs[0].p]) + (ea[bs[0].p] === 1 ? ' eagle.' : ' eagles.') : '')});

  let best = null; const cur = {};
  rs.forEach(r => r.results.forEach(x => { if (!PLAYERS.includes(x.player)) return;
    if (x.placement === 1) { const c = cur[x.player] = cur[x.player] || {n:0, from:r.date}; c.n++; c.to = r.date; if (!best || c.n > best.n) best = {p:x.player, n:c.n, from:c.from, to:c.to}; }
    else cur[x.player] = null; }));
  if (best && best.n >= 3) out.push({label:'Længste sejrsstime', value:numHTML(best.n), who:best.p, detail:'Fra ' + dLong(best.from) + ' til ' + dLong(best.to) + '.'});
  return out;
}

function drawRace(host, rs){
  const j = journey(rs), st = standings(rs), n = j.series.length;
  const W = host.clientWidth, small = W < 620, H = small ? 250 : Math.round(Math.min(420, Math.max(300, W * 0.3)));
  const pL = 4, pR = small ? 104 : 150, pT = small ? 26 : 78, pB = 30;
  const max = Math.max.apply(null, st.map(p => p.total).concat([1]));
  const x = i => pL + (i + 1) * (W - pL - pR) / n;
  const y = v => H - pB - (v / max) * (H - pT - pB);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Samlet ligapoint efter hver runde"><defs><filter id="pencil" x="-2%" y="-10%" width="104%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/></filter></defs>';
  for (let v = 0; v <= max; v += 10) s += '<line x1="' + pL + '" x2="' + (W - pR) + '" y1="' + y(v) + '" y2="' + y(v) + '" style="stroke:var(--hair)"/><text x="' + pL + '" y="' + (y(v) - 5) + '">' + v + '</text>';
  let pm = 0, lastX = -99;
  j.series.forEach((o,i) => { const m = dp(o.date).m; if (m !== pm) { pm = m; const xx = x(i); if (xx - lastX > 34) { s += '<text x="' + xx + '" y="' + (H - 8) + '" text-anchor="middle">' + cap(MON_S[m-1].replace('.','')) + '</text>'; lastX = xx; } } });
  const rowEnd = [-1e9,-1e9,-1e9];
  j.changes.forEach(c => { const xx = x(c.i), txt = dShort(c.date) + ' ' + (c.lead.length > 1 ? 'delt føring' : c.lead[0]), w = txt.length * 7.6 + 16;
    const flip = xx + w > W - pR + 30, from = flip ? xx - w : xx;
    let row = rowEnd.findIndex(e => e < from); if (row < 0) row = 0; rowEnd[row] = from + w;
    s += '<line x1="' + xx + '" x2="' + xx + '" y1="' + (small ? pT - 8 : pT - 66 + row * 21) + '" y2="' + (H - pB) + '" style="stroke:var(--rule)" stroke-dasharray="2 4"/>';
    if (!small) s += '<text x="' + (flip ? xx - 6 : xx + 6) + '" y="' + (pT - 54 + row * 21) + '"' + (flip ? ' text-anchor="end"' : '') + '>' + txt + '</text>'; });
  const styles = [['var(--brass)',3,''],['var(--ink)',2,''],['var(--ink)',1.3,'6 5'],['var(--ink)',1.3,'1.5 5']];
  s += '<g filter="url(#pencil)" fill="none" stroke-linejoin="round" stroke-linecap="round">';
  st.slice().reverse().forEach(p => { const k = st.indexOf(p), z = styles[k] || styles[3]; let d = 'M' + x(-1) + ' ' + y(0), pv = 0;
    j.series.forEach((o,i) => { const v = o.tot[p.name]; d += 'H' + x(i).toFixed(1); if (v !== pv) { d += 'V' + y(v).toFixed(1); pv = v; } });
    s += '<path d="' + d + '" style="stroke:' + z[0] + '" stroke-width="' + z[1] + '"' + (z[2] ? ' stroke-dasharray="' + z[2] + '"' : '') + '/>'; });
  s += '</g>';
  const lab = st.map(p => ({p:p, y:y(p.total)})).sort((a,b) => a.y - b.y);
  const gap = small ? 19 : 24; for (let i = 1; i < lab.length; i++) if (lab[i].y - lab[i-1].y < gap) lab[i].y = lab[i-1].y + gap;
  lab.forEach(o => { s += '<text class="end" x="' + (W - pR + (small ? 8 : 12)) + '" y="' + (o.y + 6) + '"' + (small ? ' font-size="16"' : '') + (st.indexOf(o.p) === 0 ? ' style="fill:var(--brass)"' : '') + '>' + o.p.name + ' ' + fmt(o.p.total) + '</text>'; });
  host.innerHTML = s + '</svg>';
}

function daysTo(iso){ const a = new Date(iso + 'T00:00:00'), b = new Date(); b.setHours(0,0,0,0); return Math.round((a - b) / 86400000); }

  } else if (!live) {
    left += '<p class="note" style="margin:0 0 44px">Første ligarunde er ikke sat endnu. Stillingen står 0–0–0–0, og forsiden skifter til den nye sæson, så snart første runde er ført ind.</p>';

    left += '<p class="lab">Næste ekspedition</p><h3>' + esc(ex.title) + '</h3><p class="when">' + a.d + '.–' + b.d + '. ' + MON[b.m-1] + ' ' + b.y + '</p>' +
      '<p class="lab">' + (n > 1 ? 'Om ' + n + ' dage' : n === 1 ? 'I morgen' : 'I gang nu') + '</p>' +
      '<p class="lab" style="margin-top:26px">Banerne</p><ul class="plain" style="margin-top:8px">' + ex.courses.map(c => '<li><span>' + esc(c) + '</span></li>').join('') + '</ul>' +
      '<p class="lab" style="margin-top:26px">Hvem gør hvad</p><ul class="plain" style="margin-top:8px">' + ex.duties.map(d => '<li><span>' + d[0] + '</span><span>' + d[1] + '</span></li>').join('') + '</ul>' +
      (ex.open && ex.open.length ? '<p class="note">Mangler endnu: ' + listDa(ex.open) + '.</p>' : '') +
      (ex.href ? '<p class="note"><a href="' + ex.href + '">Åbn turens side</a></p>' : '');
  }
  const row = n => '<li>' + face(n) + '<b>' + esc(PEOPLE[n].full) + '</b><span class="h">' + fmt(PEOPLE[n].hcp, 1) + '</span></li>';
  const byHcp = a => a.slice().sort((x,y) => PEOPLE[x].hcp - PEOPLE[y].hcp);
  const guests = Object.keys(PEOPLE).filter(n => !PLAYERS.includes(n));
  const right = '<h3>Feltet</h3><p class="lab" style="margin-top:14px">Ligaen</p><ul class="field">' + byHcp(PLAYERS).map(row).join('') + '</ul>' +
    '<p class="lab" style="margin-top:26px">Med på ekspeditionerne</p><ul class="field">' + byHcp(guests).map(row).join('') + '</ul>' +
    '<p class="note lab">Handicap pr. ' + HCP_DATE + '.</p>';
  return '<section class="band" id="saeson"><header><h2>' + (live ? 'Programmet' : 'Sæson ' + SEASON) + '</h2><p>' +
    (live ? 'Det næste på kalenderen — og feltet, der spiller om titlen.' : 'Ny sæson, blankt regnskab. Samme fire om titlen, og Rivieraen venter i maj.') + '</p></header>' +
    '<div class="two"><div>' + left + '</div><div>' + right + '</div></div></section>';
}

function scorecard(r){
  const cards = r.scorecards || [], H = r.holeData; if (!cards.length || !H.length) return '';
  const n = H.length, split = n === 18, pars = H.map(h => h.par);
  const part = (a, from, to) => { const s = a.slice(from, to).filter(v => v != null); return s.length ? sum(s) : ''; };
  // Én række: etiket, n hul-celler, og summerne Ud / Ind / Slag / Stbf
  const line = (tag, label, cellFn, sums, labelStyle) => {
    let h = '<tr><th class="who" scope="' + (tag === 'th' ? 'col' : 'row') + '"' + (labelStyle || '') + '>' + label + '</th>';
    for (let i = 0; i < n; i++) { h += cellFn(i); if (split && i === 8) h += '<' + tag + ' class="sm">' + sums[0] + '</' + tag + '>'; }
    if (split) h += '<' + tag + ' class="sm">' + sums[1] + '</' + tag + '>';
    return h + '<' + tag + ' class="sm">' + sums[2] + '</' + tag + '><' + tag + ' class="sm st">' + sums[3] + '</' + tag + '></tr>';
  };
  const head = line('th', 'Hul', i => '<th scope="col">' + (i+1) + '</th>', ['Ud','Ind','Slag','Stbf']).replace('class="sm st"','class="sm"') +
    line('th', 'Par', i => '<th>' + pars[i] + '</th>', [part(pars,0,9), part(pars,9,18), sum(pars), '']) +
    line('th', 'Hcp-indeks', i => '<th>' + H[i].hcp + '</th>', ['','','','']);
  const flagged = [];
  const body = cards.map(sc => {
    const g = sc.scores || [], p = sc.points || []; let off = 0;
    const cell = i => { const v = g[i]; if (v == null || v === 0) return '<td><span class="g z">–</span></td>';
      const ok = holeOk(v, p[i], H[i], sc.phcp); if (!ok) off++;
      const d = v - pars[i], c = !ok ? '' : d <= -2 ? 'ea' : d === -1 ? 'bi' : d >= 2 ? 'db' : '';
      return '<td><span class="g ' + c + (p[i] === 0 ? ' z' : '') + '">' + v + '</span><span class="pt">' + (p[i] == null ? '' : p[i]) + '</span></td>'; };
    const label = '<b>' + sc.player + (sc.nr ? ' <small>NR</small>' : '') + '</b><small>hcp ' + fmt(sc.hcp, 1) + ' · ' + sc.phcp + ' tildelte slag</small>';
    const row = line('td', label, cell, [part(g,0,9), g.length > 9 ? part(g,9,18) : '', sc.slag != null ? sc.slag : sum(g), sum(p)], ' style="font-weight:400"');
    if (off) flagged.push(sc.player + ' (' + off + (off === 1 ? ' hul' : ' huller') + ')');
    return row;
  }).join('');
  return '<div class="scw"><table class="sc" style="min-width:' + (split ? 900 : 560) + 'px"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
    '<p class="lab legend">Ring: birdie. Dobbelt ring: eagle. Firkant: dobbeltbogey eller værre. Gråt tal: ingen point på hullet. Under hvert slagtal står hullets stableford-point.</p>' +
    (flagged.length ? '<p class="lab legend">Slag og point stemmer ikke overens hos ' + listDa(flagged) + '. De huller er ikke markeret og tæller ikke med i birdie-statistikken.</p>' : '');
}

function roundsList(rs){
  if (!rs.length) return '<p class="note">Ingen runder endnu. Den første tællende runde lander her med resultat og fuldt scorekort.</p>';
  let h = '', pm = '';
  rs.slice().reverse().forEach(r => {
    const p = dp(r.date), mk = p.y + '-' + p.m;
    if (mk !== pm) { pm = mk; h += '<p class="month">' + cap(MON[p.m-1]) + '</p>'; }
    const res = r.results.slice().sort((a,b) => a.placement - b.placement);
    const sc = {}; (r.scorecards || []).forEach(c => sc[c.player] = c);
    const mini = res.map(x => '<span class="' + (x.placement === 1 ? 'win' : '') + '">' + x.player + ' ' + (x.score == null ? '–' : x.score) + (x.nr ? ' NR' : '') + '</span>').join('');
    const meta = [r.holes ? r.holes + ' huller' : '', r.time ? 'kl. ' + r.time.replace(':','.') : '', r.tee ? 'tee ' + r.tee : '', r.cr ? 'CR ' + fmt(r.cr, 1) : '', r.slope ? 'slope ' + r.slope : '', r.abroad ? 'Frankrig' : '', r.counting === false ? 'tæller ikke' : ''].filter(Boolean).join(', ');
    const rows = res.map(x => '<tr><td>' + x.placement + (x.tied ? '=' : '.') + '</td><td>' + x.player + '</td><td>' + (x.score == null ? '–' : x.score) + (x.nr ? ' NR' : '') + '</td><td>' + (sc[x.player] && sc[x.player].slag != null && !sc[x.player].nr ? sc[x.player].slag : '–') + '</td><td>' + fmt(x.points) + '</td></tr>').join('');
    h += '<details class="rnd"><summary><span class="r-date">' + dShort(r.date) + '</span><span class="r-course"><b>' + esc(clean(r.course)) + '</b>' + (r.note ? '<small>' + esc(r.note) + '</small>' : '') + '</span><span class="r-mini">' + mini + '</span><span class="r-chev" aria-hidden="true"></span></summary>' +
      '<div class="r-body"><p class="lab r-meta">' + meta + (r.guests && r.guests.length ? ', gæst: ' + listDa(r.guests) : '') + '</p>' +
      '<table class="res"><thead><tr><th>Nr.</th><th>Spiller</th><th>Stableford</th><th>Slag</th><th>Ligapoint</th></tr></thead><tbody>' + rows + '</tbody></table>' + scorecard(r) + '</div></details>';
  });
  return h;
}

function roundsBand(year, rs){
  return '<section class="band" id="runder"><header><h2>Runder ' + year + '</h2><p>Nyeste først. Klik på en runde for resultat og scorekort.</p></header>' + roundsList(rs) + '</section>';
}

function rulesBand(){
  const R = [
    ['Ligapoint','3-2-1-0 med fire spillere, 2-1-0 med tre og 1-0 med to. Står to lige, deler de pointene.'],
    ['De 15 bedste','Kun de 15 bedste runder pr. spiller tæller i sæsonregnskabet. Resten trækkes fra.'],
    ['Ekspeditioner','Riviera-runderne tæller begge steder: i turens egen turnering og som ligarunde for de fire ligaspillere.'],
    ['Puljerne','På ekspedition lægger hver mand 30 € om dagen i tre puljer à 10 €: dagens vinder, væddemålet om dagens vinder og den samlede vinder.'],
    ['Slangen','Den, der senest 3-puttede på et hul, hvor han fik point, bærer slangen. Har du den efter runden, giver du en omgang til din bold.']
  ];
  return '<section class="band" id="regler"><header><h2>Reglement</h2><p>Det hele, kort. Gælder uændret i ' + SEASON + '.</p></header><dl class="rules">' + R.map(r => '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>').join('') + '</dl></section>';
}

function archiveBand(rs26){
  return '<section class="band" id="arkiv"><header><h2>Arkiv</h2><p>Alt fra 2026 ligger her: hver runde med scorekort, de to Riviera-sider og det gamle site med årets påfund.</p></header>' +
    '<details class="vault"><summary><b>Alle ' + rs26.length + ' runder fra 2026</b><span>Fra første runde 10. april til finalen på Saint Donat 4. oktober — med fulde scorekort.</span></summary><div class="inner">' + roundsList(rs26) + '</div></details>' +
    auditVault(rs26, 2026) + '<ul class="links" style="border-top:0">' + ARCHIVE_LINKS.map(l => '<li><a href="' + l.href + '"><b>' + l.title + '</b><span>' + l.text + '</span></a></li>').join('') + '</ul></section>';
}

function fitChamp(){
  document.querySelectorAll('.champ').forEach(el => { el.style.fontSize = '';
    const max = el.clientWidth, w = el.scrollWidth;
    if (w > max + 1) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * max / w * 0.985) + 'px'; });
}

function build(){
  const r27 = prep(ROUNDS_DATA).filter(r => r.counting !== false);
  const r26 = prep(ROUNDS_2026).filter(r => r.counting !== false);
  const live = r27.length > 0;
  const year26 = spread(2026, r26, true, live) + raceBand(2026, r26) + recordsBand(2026, r26, true) + storyBand('Sidste referat', CLOSING_2026, 'referat') + rivieraBand();
  const html = live
    ? spread(SEASON, r27, false, false) + auditBand(SEASON, r27) + storyBand('Seneste runde', LATEST_ROUND, 'seneste') + seasonBand(true) + roundsBand(SEASON, prep(ROUNDS_DATA)) + raceBand(SEASON, r27) + recordsBand(SEASON, r27, false) + boardBand() + year26 + rulesBand() + archiveBand(prep(ROUNDS_2026))
    : year26 + boardBand() + seasonBand(false) + rulesBand() + archiveBand(prep(ROUNDS_2026));
  document.getElementById('top').innerHTML = html;
  const nav = live
    ? [['#stilling','Stilling'],['#saeson','Program'],['#runder','Runder'],['#tavle','Mestertavlen'],['#aarbog','Årbog 2026'],['#regler','Reglement'],['#arkiv','Arkiv']]
    : [['#aarbog','Årbog 2026'],['#rekorder','Rekorder'],['#riviera','Riviera 2026'],['#tavle','Mestertavlen'],['#saeson','Sæson ' + SEASON],['#regler','Reglement'],['#arkiv','Arkiv']];
  const trip = EXPEDITIONS.filter(e => e.href)[0];
  if (trip) nav.splice(nav.length - 2, 0, [trip.href, 'Riviera ' + trip.start.slice(0,4)]);
  document.getElementById('nav').innerHTML = nav.map(n => '<a href="' + n[0] + '">' + n[1] + '</a>').join('');
  const draw = () => { document.querySelectorAll('[data-race]').forEach(h => drawRace(h, h.dataset.race === '2026' ? r26 : r27)); fitChamp(); };
  window.__draw = draw; draw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 120); });
}
build();

// App: gør siden installérbar og læsbar uden net. Der hentes altid nyeste version, når der er forbindelse.
if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
// Android/Chrome: vis en installér-knap i sidefoden, når telefonen tilbyder det
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); const b = document.getElementById('install'); if (!b) return; b.hidden = false; b.onclick = () => { e.prompt(); b.hidden = true; }; });
</script>
