<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
/* ───────────────────────────────────────────────────────────────
   GUCCI Golf 2027 — "Rivieraen" (samme design som index.html)
   Kalkhvid stuk, marineblåt blæk, azur og mimosagul. Marcellus + Jost.
   Fuld skærmbredde: båndene går fra kant til kant.
   ─────────────────────────────────────────────────────────────── */
:root{
  --paper:#FBFAF5; --leaf:#E4EEF3; --ink:#0E2A47; --soft:#4A6079;
  --rule:rgba(14,42,71,.24); --hair:rgba(14,42,71,.11);
  --brass:#1A5FA8; --pop:#D99A0B; --board:#0E2A47; --gilt:#F6EDD6;
  --gut:clamp(20px,4.6vw,92px);
  --serif:'Marcellus','Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{font-synthesis:none;font-size:19.5px;-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
@media (max-width:600px){html{font-size:18px}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--sans);font-size:1rem;line-height:1.6;color:var(--ink);background:var(--paper);font-variant-numeric:lining-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
p{text-wrap:pretty}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.lab{font-weight:500;font-size:.84rem;letter-spacing:.03em;color:var(--soft);line-height:1.35}
.num small{font-size:.52em}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px 32px;flex-wrap:wrap;padding:16px var(--gut);border-bottom:1px solid var(--rule)}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.3rem;line-height:1;text-decoration:none}
.mark svg{width:22px;height:28px;flex:none}
.bar nav{display:flex;gap:clamp(16px,2.4vw,36px);overflow-x:auto;scrollbar-width:none;max-width:100%}
.bar nav::-webkit-scrollbar{display:none}
.bar nav a{font-weight:500;font-size:.9rem;text-decoration:none;white-space:nowrap;padding:6px 0;border-bottom:1px solid transparent}
.bar nav a:hover{border-bottom-color:var(--pop)}

/* Plakaten */
.hero{text-align:center;padding:clamp(22px,2.6vw,40px) var(--gut) clamp(36px,4.6vw,76px);border-bottom:1px solid var(--rule)}
.seal{display:block;margin:0 auto clamp(10px,1.4vw,20px);width:clamp(88px,9vw,128px);height:auto;color:var(--pop);transform:rotate(-9deg);animation:stamp .55s cubic-bezier(.2,.9,.3,1.25) .45s both}
@keyframes stamp{from{opacity:0;transform:rotate(-16deg) scale(1.55)}to{opacity:1;transform:rotate(-9deg) scale(1)}}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,8.4vw,10.5rem);line-height:1.02;margin:.14em 0 .06em}
.hero .sub{font-family:var(--serif);font-size:clamp(1.5rem,3vw,3rem);line-height:1.15}
.lede{font-family:var(--serif);font-size:clamp(1.3rem,2vw,1.75rem);line-height:1.28;max-width:34ch;margin:clamp(16px,2vw,30px) auto 0;text-wrap:balance}
.prog{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 6px;width:min(72rem,100%);margin:clamp(30px,3.6vw,56px) auto 0}
.prog li{border-top:3px solid var(--pop);padding:12px 6px 0}
.prog b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(1.15rem,1.7vw,1.5rem);line-height:1.2;margin:2px 0}
.prog span{display:block;color:var(--soft)}

/* Bånd */
.band{padding:clamp(52px,6.6vw,112px) var(--gut);border-bottom:1px solid var(--rule)}
.band.mist{background:var(--leaf)}
.band>header{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px clamp(24px,5vw,96px);align-items:end;margin-bottom:clamp(26px,3.6vw,56px)}
.band h2{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,4vw,3.6rem);line-height:1.04;text-wrap:balance}
.band>header p{color:var(--soft);max-width:50ch}
.band h3{font-family:var(--serif);font-weight:400;font-size:clamp(1.4rem,2vw,1.85rem);line-height:1.15}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,5vw,96px)}
.note{color:var(--soft);max-width:54ch}

/* Tabeller */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rt th{font-weight:500;font-size:.84rem;letter-spacing:.03em;color:var(--soft);text-align:right;padding:8px 6px;border-bottom:1px solid var(--ink);white-space:nowrap}
.rt th.l,.rt td.l{text-align:left}
.rt td{padding:10px 6px;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap}
.rt td.r{text-align:left;color:var(--soft);width:1.8em;padding-left:0}
.rt td.n{text-align:left;font-family:var(--serif);font-size:1.25rem}
.rt td.n .face{display:inline-block;vertical-align:middle;margin-right:12px}
.rt td.t{font-family:var(--serif);font-size:1.5rem;padding-right:0}
.rt tr.w td.t{color:var(--brass)}
.rt td small{display:block;color:var(--soft);font-size:.8rem;white-space:normal;line-height:1.35}
.pos{color:var(--brass)}
.ring{display:inline-grid;place-items:center;min-width:1.95em;height:1.95em;border:1.5px solid var(--pop);border-radius:50%;margin:-.3em -.35em -.3em 0}
.face{width:42px;height:42px;border-radius:50%;object-fit:cover;filter:grayscale(1) contrast(1.06);border:1px solid var(--rule);background:var(--paper);display:block}

/* Dagene */
.day{border-top:1px solid var(--rule)}
.day:last-child{border-bottom:1px solid var(--rule)}
.day>summary{display:grid;grid-template-columns:5.2rem minmax(0,1.2fr) minmax(0,1.4fr) 1.1rem;gap:0 clamp(14px,2vw,28px);align-items:baseline;padding:16px 0;cursor:pointer;list-style:none}
.day>summary::-webkit-details-marker{display:none}
.day>summary:hover .d-course b{text-decoration:underline;text-decoration-color:var(--pop);text-underline-offset:4px}
.d-no{font-family:var(--serif);font-size:1.25rem;white-space:nowrap}
.d-course b{font-weight:500}
.d-course small{display:block;color:var(--soft);font-size:.88rem}
.d-res{text-align:right;color:var(--soft)}
.d-res b{color:var(--ink);font-weight:600}
.chev{font-size:1.25rem;line-height:1;text-align:right;color:var(--brass)}
.chev::after{content:'+'}
details[open]>summary .chev::after{content:'\2013'}
.d-body{padding:6px 0 38px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px clamp(32px,5vw,96px)}
.d-body>div{min-width:0}
.d-body .wide{grid-column:1/-1}
.d-body h4{font-weight:500;font-size:.84rem;letter-spacing:.03em;color:var(--soft);margin-bottom:8px}
.plain{list-style:none;padding:0;border-top:1px solid var(--rule)}
.plain li{padding:10px 0;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.plain li span:nth-child(2){color:var(--soft);text-align:right}
.recap{columns:2 24rem;column-gap:clamp(32px,5vw,96px)}
.recap strong{font-weight:600}

/* Puljer, felt, baner, regler */
.pools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:clamp(30px,4vw,56px)}
.pools div{text-align:center;padding:4px 14px;border-left:1px solid var(--rule)}
.pools div:first-child{border-left:0}
.pools b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,5vw,4.6rem);line-height:1.05}
.pools span{display:block}
.field{list-style:none;padding:0;columns:2 22rem;column-gap:clamp(24px,5vw,96px)}
.field li{break-inside:avoid;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair)}
.field b{font-weight:500;display:block;line-height:1.25}
.field .h{font-family:var(--serif);font-size:1.4rem;font-variant-numeric:tabular-nums}
.course{border-top:1px solid var(--rule)}
.course:last-child{border-bottom:1px solid var(--rule)}
.course>summary{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 1.1rem;gap:4px clamp(24px,5vw,96px);align-items:baseline;padding:18px 0;cursor:pointer;list-style:none}
.course>summary::-webkit-details-marker{display:none}
.course>summary b{font-family:var(--serif);font-weight:400;font-size:1.45rem;line-height:1.15}
.course>summary span:nth-child(2){color:var(--soft)}
.c-body{padding:4px 0 36px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px clamp(32px,5vw,96px)}
.c-body a{color:var(--brass)}
.c-body ul{list-style:none;padding:0;border-top:1px solid var(--rule)}
.c-body li{padding:10px 0;border-bottom:1px solid var(--hair)}
.c-body strong{font-weight:600}
.hcp{width:100%;border-collapse:collapse;margin-top:18px}
.hcp td{padding:10px 0;border-bottom:1px solid var(--hair);vertical-align:top}
.hcp td:first-child{font-family:var(--serif);font-size:1.2rem;white-space:nowrap;padding-right:20px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:0 clamp(24px,5vw,96px)}
.rules div{padding:20px 0;border-top:1px solid var(--rule)}
.rules dt{font-family:var(--serif);font-size:1.4rem;line-height:1.15;margin-bottom:6px}
.rules dd{color:var(--soft);font-size:.95rem;max-width:46ch}
footer{padding:36px var(--gut) 44px;display:flex;justify-content:space-between;gap:12px 32px;flex-wrap:wrap}

@media (max-width:760px){
  .band>header,.two,.d-body,.c-body,.course>summary{grid-template-columns:1fr}
  .course>summary{grid-template-columns:minmax(0,1fr) 1.1rem}
  .course>summary span:nth-child(2){grid-column:1;grid-row:2}
  .course>summary .chev{grid-column:2;grid-row:1}
  .prog{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:24px}
  .day>summary{grid-template-columns:4.4rem minmax(0,1fr) 1.1rem}
  .d-res{grid-column:2;text-align:left}
  .day>summary .chev{grid-column:3;grid-row:1}
  .pools{grid-template-columns:1fr;gap:22px}
  .pools div{border-left:0}
  .recap{columns:1}
  .rt td.r,.rt th.r{display:none}
  .rt td.n .face{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.seal{animation:none}}

/* Som app på telefonen: menuen bliver stående øverst */
@media (display-mode:standalone){.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper)}}
</style>
</head>

// lat/lng bruges til vejrudsigten. guide:null = guiden er ikke skrevet endnu.
const COURSES = [
{"name":"Old Course Mandelieu","lat":43.53194,"lng":6.94035,"guide":{"course":"Old Course Mandelieu","par":72,"length":"5.520m","architect":"Storfyrst Michael / Harry Colt · 1891","philosophy":"<strong>Côte d’Azurs ældste bane</strong>, grundlagt 1891 af Storfyrst Michael af Rusland i eksil fra zaren og nyforelsket i golf efter et besøg i St Andrews. Siden ombygget af Harry Colt. Omkring 3.000 parasolfyrretræer dominerer den flade bane, og man krydser floden La Siagne på træfærge undervejs. Hul 15 blev i 2026 lavet om fra par 4 til par 5, så banen nu er par 72.<div><a href=\"https://www.golfoldcourse.com/?lang=en\" target=\"_blank\">Banens hjemmeside</a></div>","tactics":[{"icon":"🚤","text":"<strong>Færgen:</strong> Du krydser La Siagne på træfærge undervejs. Tag det roligt — det er en del af historien."},{"icon":"🎯","text":"<strong>Target golf:</strong> Banen er kort, men parasoltræerne gør det til præcisionsspil. Placér drivet."},{"icon":"🌲","text":"<strong>Træerne:</strong> Brede hængende grene blokerer den korte linje på flere huller. Strategi frem for distance."},{"icon":"⛳","text":"<strong>Nyt hul 15:</strong> Ombygget til par 5 i 2026 — et ekstra point i vente for alle, og en birdie-chance for den modige."},{"icon":"🏌️","text":"<strong>Driver er ikke altid svaret.</strong> Langt jern eller fairwaywood er ofte den bedste tee-shot."},{"icon":"🏰","text":"<strong>Historiens vingesus:</strong> Europas kronede hoveder har spillet her, og Victor Dubuisson lærte spillet på banen."}],"hcp":[{"range":"9–13","advice":"Den mest scoringsvenlige bane på turen. Positionering giver fri bane til birdies."},{"range":"14–19","advice":"Venlig bane. Spil med selvtillid — respektér blot træerne."},{"range":"20–25","advice":"Bedste dag til at hente point. Spil roligt og nyd den historiske atmosfære."}]}},
{"name":"Terre Blanche","lat":43.591,"lng":6.73182,"guide":{"course":"Terre Blanche — Le Château","par":72,"length":"6.616m","architect":"Dave Thomas · 2004 · Top 15 Kontinentaleuropa","philosophy":"En af de bedste baner i Europa. Krævende fra tee, men ikke latterligt straffende. Fire fremragende par 3-huller der alle kræver din fulde opmærksomhed.","tactics":[{"icon":"🏌️","text":"<strong>Fra tee:</strong> Placér drivet præcist. Du skal finde de rigtige positioner for at have kontrol ind mod greens."},{"icon":"⛰️","text":"<strong>Hul 2 (par 3, 167m):</strong> Det sværeste par 3. Spilles opad — tag én til halvanden klub ekstra. Favoriser højre side. Klippebækken foran er forbudt."},{"icon":"🌲","text":"<strong>Hul 3 (par 4, 427m):</strong> Sværeste hul. Smalt landingsområde på 28 yards med bunker til højre."},{"icon":"💧","text":"<strong>Spektakulære vandforhindringer.</strong> Beslut dig fra tee — ikke halvvejs nede ad fairwayen."},{"icon":"🚩","text":"<strong>Hul 18 (par 4, 373m):</strong> Ikke til højre, ikke til venstre. Stenmur langs højre side."},{"icon":"⛳","text":"<strong>Greens:</strong> Store og hurtige. Overskyd aldrig flagget. Læs greens nøje."}],"hcp":[{"range":"8–12","advice":"Risk/reward — beslut bevidst. Par 3-hullerne kræver præcist klubvalg, ikke ambitioner."},{"range":"13–18","advice":"Gule tees er det rigtige valg. Spil inden for dig selv."},{"range":"19–21","advice":"Midt-green altid. Vand og bunkere omgiver alle greenkanterne."}]}},

   3. MOTOREN

const MON = ['januar','februar','marts','april','maj','juni','juli','august','september','oktober','november','december'];
const WD = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const TAL = ['nul','én','to','tre','fire','fem','seks','syv','otte','ni','ti'];
const dp = s => { const a = s.split('-').map(Number); return {y:a[0], m:a[1], d:a[2]}; };
const dLong = s => { const p = dp(s); return p.d + '. ' + MON[p.m-1]; };
const dWeek = s => { const p = dp(s); return WD[new Date(p.y, p.m-1, p.d).getDay()] + ' ' + p.d + '. ' + MON[p.m-1]; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sum = a => a.reduce((s,v) => s + v, 0);
const listDa = a => a.length < 2 ? (a[0] || '') : a.slice(0,-1).join(', ') + ' og ' + a[a.length-1];
const eur = v => (Number.isInteger(v) ? String(v) : v.toFixed(2).replace('.', ',')) + ' €';
const P = id => PLAYERS.find(p => p.id === id);
const first = id => { const p = P(id); return p ? p.name.split(' ')[0] : id; };
const face = id => PHOTOS[id] ? '<img class="face" src="' + PHOTOS[id] + '" alt="">' : '';
const courseOf = d => COURSES.find(c => c.name === d.course);
const played = () => DAYS.filter(d => d.results && d.results.length);
const dayWinners = d => { const m = Math.max.apply(null, d.results.map(r => r.stbf)); return d.results.filter(r => r.stbf === m).map(r => r.player); };
const daysTo = iso => { const a = new Date(iso + 'T00:00:00'), b = new Date(); b.setHours(0,0,0,0); return Math.round((a - b) / 86400000); };

function totals(){
  const t = {}; PLAYERS.forEach(p => t[p.id] = 0);
  DAYS.forEach(d => (d.results || []).forEach(r => { if (t[r.player] != null) t[r.player] += r.stbf; }));
  return t;
}

// Tre puljer à STAKE pr. mand pr. dag: dagens vinder, væddemålet og den samlede vinder.
// Rammer ingen dagens vinder i væddemålet, går puljen videre til næste spilledag.
function economy(){
  const n = PLAYERS.length, pot = n * STAKE, pd = played();
  const acc = {}; PLAYERS.forEach(p => acc[p.id] = {paid:pd.length * 3 * STAKE, won:0, lines:[]});
  const give = (id, amount, text) => { if (acc[id]) { acc[id].won += amount; acc[id].lines.push(text + ' ' + eur(amount)); } };
  const days = {}; let carry = 0;
  DAYS.forEach(d => {
    const info = days[d.day] = {pot:pot, betPool:pot + carry, carryIn:carry, correct:[], winners:[]};
    if (!d.results || !d.results.length) return;
    const w = info.winners = dayWinners(d);
    w.forEach(id => give(id, pot / w.length, 'Dag ' + d.day + ', dagens vinder'));
    const c = info.correct = Object.keys(d.bets || {}).filter(b => w.includes(d.bets[b]));
    if (c.length) { c.forEach(id => give(id, info.betPool / c.length, 'Dag ' + d.day + ', væddemål')); carry = 0; }
    else carry = info.betPool;
  });
  const overall = n * STAKE * DAYS.length, done = pd.length === DAYS.length;
  if (done) { const t = totals(), m = Math.max.apply(null, Object.values(t)), w = Object.keys(t).filter(id => t[id] === m);
    w.forEach(id => give(id, overall / w.length, 'Samlet vinder')); }
  Object.values(acc).forEach(a => a.net = a.won - a.paid);
  return {acc:acc, days:days, pot:pot, overall:overall, done:done, leftover:done ? carry : 0};
}

// Finaledagens bolde sættes efter stillingen: de tre lavest placerede går først ud.
function groupsFor(d){
  if (d.groups) return d.groups;
  const last = DAYS[DAYS.length - 1];
  if (d !== last || played().length < DAYS.length - 1 || (d.results || []).length) return null;
  const t = totals(), ord = Object.keys(t).sort((a,b) => t[a] - t[b]);
  return {threeball:{time:null, players:ord.slice(0,3)}, fourball:{time:null, players:ord.slice(3)}};
}

function sealSVG(text){
  const t = (text + ' · ').repeat(2);
  return '<svg class="seal" viewBox="0 0 160 160" aria-hidden="true"><defs><path id="sealc" d="M80 80m-59 0a59 59 0 1 1 118 0a59 59 0 1 1-118 0"/></defs>' +
    '<g fill="none" stroke="currentColor"><circle cx="80" cy="80" r="76" stroke-width="2.4"/><circle cx="80" cy="80" r="71" stroke-width=".8"/><circle cx="80" cy="80" r="46" stroke-width=".8"/>' +
    '<text font-size="13.5" font-weight="600" fill="currentColor" stroke="none" style="font-family:var(--sans);letter-spacing:.14em"><textPath href="#sealc" textLength="362" lengthAdjust="spacing">' + esc(t.toUpperCase()) + '</textPath></text>' +
    '<g stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M72.5 56C73 72 72.2 88 72.9 104"/><path d="M72.8 57C81 59.2 89 62 97 66.5 89.3 69.6 81.2 72 73.2 75.6"/><path d="M60 105C68 101.5 80 101.2 90 104.4"/></g></g></svg>';
}

function heroHTML(){
  const a = dp(TRIP.start), b = dp(TRIP.end), pd = played(), t = totals();
  const ord = Object.keys(t).sort((x,y) => t[y] - t[x]), lead = ord.filter(id => t[id] === t[ord[0]]);
  const n = daysTo(TRIP.start);
  let lede;
  if (pd.length === DAYS.length) lede = listDa(lead.map(first)) + (lead.length > 1 ? ' deler sejren' : ' vinder') + ' med ' + t[ord[0]] + ' point' + (lead.length === 1 && ord[1] ? ' — ' + (t[ord[0]] - t[ord[1]]) + ' foran ' + first(ord[1]) + '.' : '.');
  else if (pd.length) lede = listDa(lead.map(first)) + (lead.length > 1 ? ' deler føringen' : ' fører') + ' med ' + t[ord[0]] + ' point efter ' + TAL[pd.length] + ' af ' + TAL[DAYS.length] + ' runder.';
  else lede = (n > 1 ? 'Om ' + n + ' dage. ' : n === 1 ? 'I morgen. ' : '') + cap(TAL[DAYS.length]) + ' runder, ' + TAL[COURSES.length] + ' baner og tre puljer.';
  const ordered = DAYS.every(d => d.course);
  const prog = ordered
    ? DAYS.map(d => { const g = groupsFor(d), times = g ? [g.threeball.time, g.fourball.time].filter(Boolean).join(' og ') : '';
        return '<li><span class="lab">Dag ' + d.day + '</span><b>' + esc(d.course) + '</b><span>' + (d.date ? cap(dWeek(d.date)) : 'Dato følger') + (times ? ', kl. ' + times.replace(/:/g,'.') : '') + '</span></li>'; }).join('')
    : COURSES.map(c => '<li><b>' + esc(c.name) + '</b><span>Dag og teetid følger</span></li>').join('');
  return '<section class="hero">' + sealSVG(TRIP.title + ' · ' + cap(MON[b.m-1]) + ' ' + b.y) +
    '<p class="lab">' + TRIP.place + ', ' + a.d + '.–' + b.d + '. ' + MON[b.m-1] + ' ' + b.y + '</p>' +
    '<h1>' + TRIP.title + '</h1><p class="sub">' + TRIP.edition + '</p><p class="lede">' + lede + '</p>' +
    '<ol class="prog">' + prog + '</ol></section>';
}

function standingsHTML(){
  const pd = played(), t = totals();
  let body;
  if (!pd.length) body = '<p class="note">Stillingen åbner efter første runde. Flest stableford-point over de ' + TAL[DAYS.length] + ' dage vinder turen og pulje 3.</p>';
  else {
    const rows = PLAYERS.map(p => ({p:p, tot:t[p.id]})).sort((a,b) => b.tot - a.tot);
    body = '<div class="tw"><table class="rt"><thead><tr><th class="l r"></th><th class="l">Spiller</th>' + DAYS.map(d => '<th>Dag ' + d.day + '</th>').join('') + '<th>I alt</th></tr></thead><tbody>' +
      rows.map((r,i) => '<tr class="' + (r.tot === rows[0].tot ? 'w' : '') + '"><td class="r">' + (rows.findIndex(q => q.tot === r.tot) + 1) + '</td><td class="n">' + face(r.p.id) + first(r.p.id) + '</td>' +
        DAYS.map(d => { const x = (d.results || []).find(y => y.player === r.p.id); if (!x) return '<td>–</td>'; return '<td>' + (dayWinners(d).includes(r.p.id) ? '<span class="ring">' + x.stbf + '</span>' : x.stbf) + '</td>'; }).join('') +
        '<td class="t">' + r.tot + '</td></tr>').join('') + '</tbody></table></div><p class="lab" style="margin-top:14px">Ring om dagens bedste score.</p>';
  }
  return '<section class="band mist" id="stilling"><header><h2>Samlet stilling</h2><p>Stableford lagt sammen dag for dag.' + (pd.length ? ' ' + cap(TAL[pd.length]) + ' af ' + TAL[DAYS.length] + ' runder er spillet.' : '') + '</p></header>' + body + '</section>';
}

function ballHTML(label, ball, marker){
  if (!ball || !ball.players || !ball.players.length) return '';
  const ps = ball.players.slice().sort((a,b) => ((P(a) || {}).hcp || 99) - ((P(b) || {}).hcp || 99));
  return '<div><h4>' + label + (ball.time ? ', kl. ' + ball.time.replace(':','.') : '') + '</h4><ul class="plain">' +
    ps.map(id => '<li><span>' + first(id) + (marker === id ? ' <span class="lab">fører scorekort</span>' : '') + '</span><span>hcp ' + ((P(id) || {}).hcp || 0).toFixed(1).replace('.', ',') + '</span></li>').join('') + '</ul></div>';
}

function daysHTML(){
  const eco = economy();
  const blocks = DAYS.map(d => {
    const has = d.results && d.results.length, info = eco.days[d.day], g = groupsFor(d), c = courseOf(d);
    const res = has ? d.results.slice().sort((a,b) => b.stbf - a.stbf) : [];
    const w = info.winners;
    const sumRight = has ? '<b>' + listDa(w.map(first)) + ' ' + res[0].stbf + '</b>' : (d.course ? 'Afventer' : 'Bane og dato følger');
    let body = '';
    if (has) body += '<div><h4>Resultat</h4><div class="tw"><table class="rt"><thead><tr><th class="l r"></th><th class="l">Spiller</th><th>Stableford</th><th>Pulje 1</th></tr></thead><tbody>' +
      res.map((r,i) => '<tr class="' + (w.includes(r.player) ? 'w' : '') + '"><td class="r">' + (res.findIndex(q => q.stbf === r.stbf) + 1) + '</td><td class="n">' + first(r.player) + '</td><td class="t">' + r.stbf + '</td><td>' + (w.includes(r.player) ? eur(info.pot / w.length) : '–') + '</td></tr>').join('') + '</tbody></table></div></div>';
    const bets = Object.keys(d.bets || {});
    body += '<div><h4>Væddemål, pulje ' + eur(info.betPool) + (info.carryIn ? ' (heraf ' + eur(info.carryIn) + ' overført)' : '') + '</h4>' +
      (bets.length ? '<ul class="plain">' + bets.map(b => '<li><span>' + first(b) + ' tipper ' + first(d.bets[b]) + '</span><span>' + (has ? (info.correct.includes(b) ? '<b class="pos">' + eur(info.betPool / info.correct.length) + '</b>' : '–') : '') + '</span></li>').join('') + '</ul>' +
        (has && !info.correct.length ? '<p class="note" style="margin-top:10px">Ingen ramte. Puljen går videre til næste dag.</p>' : '')
        : '<p class="note">Buddene meldes ind senest dagen før.</p>') + '</div>';
    if (g) body += ballHTML('Bold 1', g.threeball, d.markers && d.markers.threeball) + ballHTML('Bold 2', g.fourball, d.markers && d.markers.fourball);
    else if (!has) body += '<div><h4>Bolde</h4><p class="note">' + (d === DAYS[DAYS.length - 1] ? 'Finaledagens bolde sættes efter stillingen, når de første tre runder er spillet: de tre lavest placerede går først ud.' : 'Bolde og teetider meldes ud inden afrejse.') + '</p></div>';
    const s = d.snakeHolder;
    body += '<div><h4>Slangen</h4>' + (s ? '<ul class="plain"><li><span>Bold 1</span><span>' + (s.threeball ? first(s.threeball) + ' giver en omgang' : 'Ingen 3-putts') + '</span></li><li><span>Bold 2</span><span>' + (s.fourball ? first(s.fourball) + ' giver en omgang' : 'Ingen 3-putts') + '</span></li></ul>' : '<p class="note">Afgøres på banen.</p>') + '</div>';
    if (c && c.lat && d.date) body += '<div class="wide"><h4>Vejret ved første teetid</h4><p class="note" data-wx="' + d.day + '">Udsigten vises, når runden er inden for 16 dage.</p></div>';
    if (d.recap) body += '<div class="wide"><h4>Dagens referat</h4><div class="recap"><p>' + d.recap + '</p></div></div>';
    return '<details class="day"' + (has && d === played().slice(-1)[0] ? ' open' : '') + '><summary><span class="d-no">Dag ' + d.day + '</span><span class="d-course"><b>' + (d.course ? esc(d.course) : 'Bane følger') + '</b>' + (d.date ? '<small>' + cap(dWeek(d.date)) + '</small>' : '') + '</span><span class="d-res">' + sumRight + '</span><span class="chev" aria-hidden="true"></span></summary><div class="d-body">' + body + '</div></details>';
  }).join('');
  return '<section class="band" id="dagene"><header><h2>Dagene</h2><p>Bolde, væddemål, resultat, slange og referat — dag for dag. Thomas fører resultaterne ind efter hver runde.</p></header>' + blocks + '</section>';
}

    ['Oplæg', 'Oplæg på fairways — inden for en scorekortsbredde, aldrig nærmere hullet.'],
    ['Væddemålet', 'Hver spiller tipper dagens vinder senest dagen før. De, der rammer, deler puljen. Rammer ingen, går puljen videre til næste dag.'],
    ['Slangen', '3-putter du på green på et hul, hvor du får point, overtager du slangen. Put fra fringe tæller ikke, og 3-putter du uden at få point, beholder den forrige slangen. Har du den efter runden, giver du en omgang til din bold.'],
    ['Finaledagen', 'Boldene sættes efter stillingen: de tre lavest placerede går først ud, resten i sidste bold.']
  ];
  return '<section class="band" id="regler"><header><h2>Regler</h2><p>Som på de to ture i 2026.</p></header><dl class="rules">' + R.map(r => '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>').join('') + '</dl></section>';
}

// Vejr ved første teetid (open-meteo dækker 16 dage frem).
function weather(){
  const now = new Date(); now.setHours(0,0,0,0);
  DAYS.forEach(d => { const c = courseOf(d), el = document.querySelector('[data-wx="' + d.day + '"]'); if (!c || !c.lat || !d.date || !el) return;
    const diff = daysTo(d.date); if (diff < 0 || diff > 15) return;
    const g = groupsFor(d), hr = g && g.threeball.time ? parseInt(g.threeball.time, 10) : 11;
    fetch('https://api.open-meteo.com/v1/forecast?latitude=' + c.lat + '&longitude=' + c.lng + '&hourly=temperature_2m,precipitation,windspeed_10m&timezone=Europe%2FParis&forecast_days=16')
      .then(r => r.json()).then(j => { const i = j.hourly.time.indexOf(d.date + 'T' + String(hr).padStart(2,'0') + ':00'); if (i < 0) return;
        el.textContent = Math.round(j.hourly.temperature_2m[i]) + '°, vind ' + Math.round(j.hourly.windspeed_10m[i]) + ' km/t, nedbør ' + j.hourly.precipitation[i].toFixed(1).replace('.', ',') + ' mm i timen (kl. ' + hr + ').'; })
      .catch(() => {}); });
}

function render(){
  document.getElementById('top').innerHTML = heroHTML() + standingsHTML() + daysHTML() + economyHTML() + practicalHTML() + fieldHTML() + coursesHTML() + rulesHTML();
  weather();
}
render();
